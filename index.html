<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Laurel Games</title>
<meta name="description" content="Laurel Games, a small studio making casual mobile games. Contact: hi@laurel.games" />

<meta property="og:description" content="A small studio making casual mobile games." />

<meta property="og:url" content="https://laurel.games/" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root{
    --ivory:#f3e9d6;
    --glow:#f0c9a4;
    --night:#141f4d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--night) linear-gradient(#141f4d 0%, #4f66b0 50%, #e8b48a 58%, #1c2a4a 60%, #131a30 100%);
    color:var(--ivory);
    font-family:"Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* the painting */
  #scene{
    position:fixed; inset:0; width:100%; height:100%; display:block;
    opacity:0; transition:opacity 1.2s ease-out;
  }
  #scene.ready{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #scene{ transition:none; }
  }
  /* linen tooth over the paint, and a soft darkening at the corners */
  .tooth{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:soft-light; opacity:.22;
  }
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(8,10,28,.45) 100%);
  }

  /* the only two things on the page */
  .brand{
    position:fixed; z-index:3;
    top:calc(28px + env(safe-area-inset-top)); left:calc(30px + env(safe-area-inset-left));
    display:flex; align-items:center; gap:14px;
    color:var(--ivory); text-decoration:none;
    filter:drop-shadow(0 1px 1px rgba(8,10,28,.55)) drop-shadow(0 4px 22px rgba(8,10,28,.45));
  }
  .brand svg{ width:46px; height:46px; flex:none; }
  .brand h1{
    font-size:30px; font-weight:500; font-variation-settings:"opsz" 48;
    line-height:1; letter-spacing:.03em; white-space:nowrap;
  }
  .contact{
    position:fixed; z-index:3;
    right:calc(32px + env(safe-area-inset-right)); bottom:calc(26px + env(safe-area-inset-bottom));
    font-style:italic; font-weight:400; font-size:20px; font-variation-settings:"opsz" 24;
    letter-spacing:.01em;
    color:var(--ivory); text-decoration:none;
    text-shadow:0 1px 1px rgba(8,10,28,.6), 0 3px 18px rgba(8,10,28,.5);
    border-bottom:1px solid rgba(243,233,214,.35); padding-bottom:2px;
    transition:border-color .2s;
  }
  .contact:hover{ border-color:var(--glow); }
  .brand:focus-visible, .contact:focus-visible{
    outline:2px solid var(--glow); outline-offset:6px; border-radius:2px;
  }
  @media (max-width:600px){
    .brand{ top:calc(20px + env(safe-area-inset-top)); left:calc(20px + env(safe-area-inset-left)); gap:11px; }
    .brand svg{ width:38px; height:38px; }
    .brand h1{ font-size:24px; }
    .contact{ right:auto; left:calc(22px + env(safe-area-inset-left)); bottom:calc(22px + env(safe-area-inset-bottom)); font-size:18px; }
  }
</style>
</head>

<script>
/* ------------------------------------------------------------------
   The painting. Everything is laid down as brush dabs from a seeded
   random stream, so the picture is the same on every visit and is
   painted fresh for whatever screen it is on. Back to front: sky,
   far hills, lake, near bank, the tree, and the child under it.
------------------------------------------------------------------ */
(function(){
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha:false });
  const TAU = Math.PI * 2;

  // ---- seeded random -------------------------------------------------
  let seed = 0;
  function reseed(s){ seed = s >>> 0; }
  function rnd(){                       // mulberry32
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const R  = (a, b) => a + (b - a) * rnd();
  const RG = () => (rnd() + rnd() + rnd()) / 1.5 - 1;   // roughly gaussian, -1..1
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  // 1-D value noise for ridges and shorelines
  function noise1(freq, octaves, seedShift){
    const tbl = []; const save = seed; reseed(save ^ seedShift);
    for (let i = 0; i < 512; i++) tbl.push(rnd());
    reseed(save);
    return x => {
      let v = 0, amp = 1, f = freq, norm = 0;
      for (let o = 0; o < octaves; o++){
        const p = x * f, i = Math.floor(p), t = smooth(p - i);
        v += amp * lerp(tbl[i & 511], tbl[(i + 1) & 511], t); norm += amp;
        amp *= .5; f *= 2.1;
      }
      return v / norm;                  // 0..1
    };
  }

  // ---- colour ---------------------------------------------------------
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const mix = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  function ramp(stops){
    stops = stops.map(s => [s[0], hex(s[1])]);
    return t => {
      t = clamp(t, 0, 1);
      for (let i = 1; i < stops.length; i++){
        if (t <= stops[i][0]){
          const [t0, c0] = stops[i-1], [t1, c1] = stops[i];
          return mix(c0, c1, (t - t0) / (t1 - t0));
        }
      }
      return stops[stops.length-1][1];
    };
  }
  function rgb2hsl(c){
    const r = c[0]/255, g = c[1]/255, b = c[2]/255, mx = Math.max(r,g,b), mn = Math.min(r,g,b);
    let h = 0, s = 0; const l = (mx + mn) / 2;
    if (mx !== mn){
      const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h /= 6;
    }
    return [h, s, l];
  }
  function hsl2rgb(h, s, l){
    h = ((h % 1) + 1) % 1;
    if (s === 0) return [l*255, l*255, l*255];
    const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = ((t % 1) + 1) % 1;
      return t < 1/6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
    return [f(h + 1/3) * 255, f(h) * 255, f(h - 1/3) * 255];
  }
  // broken colour: nudge hue, saturation and lightness a little per dab
  function jit(c, dh, ds, dl){
    const [h, s, l] = rgb2hsl(c);
    return hsl2rgb(h + RG() * dh, clamp(s + RG() * ds, 0, 1), clamp(l + RG() * dl, 0, 1));
  }
  const css = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

  // ---- brush ------------------------------------------------------------
  function dab(x, y, w, h, rot, c, a){
    ctx.beginPath();
    ctx.ellipse(x, y, w / 2, h / 2, rot, 0, TAU);
    ctx.fillStyle = css(c, a);
    ctx.fill();
  }
  function stroke(x, y, len, ang, wid, c, a){
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.strokeStyle = css(c, a); ctx.lineWidth = wid; ctx.lineCap = "round";
    ctx.stroke();
  }

  // ---- the picture ---------------------------------------------------
  function paint(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    reseed(0x1A08E1);

    const portrait = W < H * 1.05;
    const S = clamp(H / 900, .6, 1.6);            // brush scale
    const A = W * H;                              // for dab counts
    const P = portrait ? {
      horizon:.60, glowX:.70, trunkX:.27, trunkW:.16, canopy:[.36,.20,.62,.30],
      shoreL:.80, shoreR:.87
    } : {
      horizon:.57, glowX:.68, trunkX:.23, trunkW:.075, canopy:[.30,.19,.44,.32],
      shoreL:.80, shoreR:.88
    };
    const yH = H * P.horizon, gx = W * P.glowX;

    // sky by height, then warmed near the afterglow
    const skyRamp = ramp([[0,"#15205a"],[.30,"#284091"],[.58,"#5372c0"],[.80,"#93a0d8"],[.92,"#cfa9b5"],[1,"#eebb92"]]);
    const glowRamp = ramp([[0,"#f6c89a"],[.5,"#e6a07c"],[1,"#c98aa0"]]);
    function sky(x, y){
      const t = clamp(y / yH, 0, 1);
      let c = skyRamp(t);
      const d = Math.hypot((x - gx) / (W * .55), (y - yH) / (H * .42));
      const g = Math.pow(clamp(1 - d, 0, 1), 1.8) * smooth(t * 1.4 - .3);
      return mix(c, glowRamp(d), g * .85);
    }
    const ridgeN1 = noise1(2.2 / W, 3, 0x51), ridgeN2 = noise1(3.4 / W, 3, 0x77);
    const farRidge  = x => yH - H * (.045 + .075 * ridgeN1(x) * smooth((x - W * .05) / (W * .3)));
    const nearRidge = x => yH - H * (.015 + .045 * ridgeN2(x + W * .3));
    const farHill = hex("#4b4f8e"), nearHill = hex("#2e3468");

    // shoreline of the near bank, higher on the left where the tree stands
    const shoreN = noise1(4 / W, 2, 0x99);
    const shore = x => H * lerp(P.shoreL, P.shoreR, smooth(x / W)) + H * .012 * (shoreN(x) - .5);

    // ---- sky ----
    {
      const g = ctx.createLinearGradient(0, 0, 0, yH);
      [0,.3,.58,.8,.92,1].forEach(t => g.addColorStop(t, css(skyRamp(t), 1)));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, yH + 2);
      const n = A / 130;
      for (let i = 0; i < n; i++){
        const x = R(-20, W + 20), y = R(-10, yH + 4);
        let c = sky(x, y);
        const r = rnd();
        if (r < .10) c = jit(c, .07, .12, .06);                // violet / lavender flecks
        else if (r < .14 && y > yH * .6) c = mix(c, hex("#f5d6a8"), .22); // pale warmth low down
        else c = jit(c, .02, .06, .035);
        const w = R(12, 30) * S, h = R(3.5, 7.5) * S;
        dab(x, y, w, h, RG() * .16, c, R(.45, .8));
      }
      // the last of the sun, a luminous band just above the hills
      for (let i = 0; i < A / 5000; i++){
        const x = gx + RG() * W * .2, y = yH - Math.abs(RG()) * H * .07 - 2;
        const c = jit(mix(hex("#fbe0b4"), hex("#f0b98c"), rnd()), .02, .05, .04);
        dab(x, y, R(14, 34) * S, R(3, 6) * S, RG() * .08, c, R(.2, .45));
      }
      // a few stars high up, and the evening star near the glow
      for (let i = 0; i < 26; i++){
        const x = R(0, W), y = R(0, yH * .45);
        dab(x, y, R(1, 1.8) * S, R(1, 1.8) * S, 0, hex("#f0ecff"), R(.2, .55));
      }
      dab(gx + W * .16, yH * .36, 2.6 * S, 2.6 * S, 0, hex("#fff6e6"), .9);
      dab(gx + W * .16, yH * .36, 7 * S, 7 * S, 0, hex("#fff0d8"), .18);
    }

    // ---- far hills ----
    function hillLayer(ridge, col, dark){
      ctx.beginPath(); ctx.moveTo(0, yH + 2);
      for (let x = 0; x <= W; x += 6) ctx.lineTo(x, ridge(x));
      ctx.lineTo(W, yH + 2); ctx.closePath();
      ctx.fillStyle = css(col, 1); ctx.fill();
      const n = A / 900;
      for (let i = 0; i < n; i++){
        const x = R(0, W), top = ridge(x);
        if (top >= yH) continue;
        const y = R(top, yH), t = (y - top) / (yH - top + 1);
        let c = mix(col, dark, t * .6);
        const nearGlow = Math.pow(clamp(1 - Math.abs(x - gx) / (W * .35), 0, 1), 2);
        c = mix(c, hex("#9a7a9a"), (1 - t) * nearGlow * .5);
        c = jit(c, .03, .08, .04);
        dab(x, y, R(10, 24) * S, R(3, 6) * S, RG() * .12, c, R(.35, .7));
      }
    }
    hillLayer(farRidge, farHill, hex("#2a2f66"));
    hillLayer(nearRidge, nearHill, hex("#1f2450"));

    // ---- lake ----
    function lake(x, y){
      // the water mirrors the sky; nearer water reads darker and bluer
      const yr = yH - (y - yH) * 1.15;
      let c = sky(x, yr);
      if (yr > nearRidge(x)) c = mix(c, nearHill, .8);
      else if (yr > farRidge(x)) c = mix(c, farHill, .7);
      const t = clamp((y - yH) / (H - yH), 0, 1);
      c = mix(c, hex("#1b2a58"), .2 + .42 * t);
      return c;
    }
    {
      ctx.fillStyle = css(hex("#243a78"), 1); ctx.fillRect(0, yH, W, H - yH);
      const n = A / 150;
      for (let i = 0; i < n; i++){
        const x = R(-40, W + 40), y = R(yH, H);
        if (y > shore(x) + 8 * S) continue;
        let c = lake(x, y);
        const r = rnd();
        if (r < .12) c = jit(c, .08, .12, .06);
        else c = jit(c, .02, .06, .04);
        const depth = (y - yH) / (H - yH);
        const w = R(16, 46) * S * (0.7 + depth), h = R(2.5, 5) * S * (0.8 + depth * .6);
        dab(x, y, w, h, RG() * .05, c, R(.4, .75));
      }
      // the afterglow lying on the water in broken strokes
      const rows = (H - yH) / (5 * S);
      for (let i = 0; i < rows; i++){
        const y = yH + i * 5 * S + R(0, 3 * S);
        const depth = (y - yH) / (H - yH);
        if (y > shore(gx) - 20 * S) break;
        const spread = W * (.02 + .12 * depth);
        for (let k = 0; k < 2; k++){
          const x = gx + RG() * spread;
          const len = R(14, 60) * S * (0.6 + depth);
          const c = mix(hex("#f3c48f"), hex("#d99a80"), depth);
          stroke(x - len / 2, y, len, 0, R(2, 4) * S, jit(c, .02, .05, .05), R(.25, .55) * (1 - depth * .5));
        }
      }
      // faint ripple lines
      for (let i = 0; i < A / 9000; i++){
        const x = R(0, W), y = R(yH + 10 * S, H);
        if (y > shore(x) - 10 * S) continue;
        const c = jit(mix(lake(x, y), hex("#c9d3f5"), .45), .03, .05, .04);
        stroke(x, y, R(30, 120) * S, RG() * .02, R(1, 1.8) * S, c, R(.12, .3));
      }
    }

    // ---- near bank ----
    {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 6) ctx.lineTo(x, shore(x));
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = css(hex("#151d38"), 1); ctx.fill();
      const cols = [hex("#1c2740"), hex("#22344a"), hex("#1d3138"), hex("#2a2f52"), hex("#213c3a")];
      const n = A / 260;
      for (let i = 0; i < n; i++){
        const x = R(-20, W + 20), y = R(shore(x) - 4 * S, H + 10);
        const c = jit(cols[(rnd() * cols.length) | 0], .03, .08, .05);
        dab(x, y, R(8, 20) * S, R(4, 9) * S, RG() * .35, c, R(.4, .8));
      }
      // grass in loose tufts, leaning a little toward the water
      for (let t = 0; t < A / 26000; t++){
        const tx = R(-10, W + 10), ty = R(shore(tx) + 4 * S, H + 6), k = R(6, 22);
        const lit = Math.pow(clamp(1 - Math.abs(tx - gx) / (W * .3), 0, 1), 2) * (1 - (ty - shore(tx)) / (H - shore(tx) + 1));
        for (let i = 0; i < k; i++){
          const x = tx + RG() * 22 * S, y = ty + RG() * 8 * S;
          let c = mix(hex("#243d3a"), hex("#3a604f"), rnd());
          c = mix(c, hex("#a8846c"), lit * .5);
          stroke(x, y, R(4, 13) * S, -TAU / 4 + RG() * .55, R(1, 1.9) * S, jit(c, .03, .1, .06), R(.35, .75));
        }
      }
      // wet edge catching the last light
      for (let x = -10; x < W + 10; x += 4 * S){
        const lit = .25 + .75 * Math.pow(clamp(1 - Math.abs(x - gx) / (W * .4), 0, 1), 1.5);
        dab(x + RG() * 3, shore(x) + RG() * 2, R(6, 14) * S, R(1.2, 2.4) * S, 0, hex("#9fa8d8"), R(.15, .4) * lit);
      }
    }

    // ---- the laurel tree ----
    const tx0 = W * P.trunkX, tw = W * P.trunkW;              // base centre and width
    const [ccx, ccy, crx, cry] = P.canopy;
    const canopy = { x: W * ccx, y: H * ccy, rx: W * crx, ry: H * cry };
    const yBase = shore(tx0) + H * .10, yTop = H * .40;
    const trunkX = y => tx0 + W * .018 * Math.sin((yBase - y) / (yBase - yTop) * 2.2);  // gentle lean
    const trunkW = y => tw * lerp(1.15, .55, smooth((yBase - y) / (yBase - yTop)));
    {
      // silhouette with root flare
      ctx.beginPath();
      ctx.moveTo(tx0 - tw * 1.3, yBase + 6);
      for (let y = yBase; y >= yTop; y -= 8) ctx.lineTo(trunkX(y) - trunkW(y) / 2, y);
      for (let y = yTop; y <= yBase; y += 8) ctx.lineTo(trunkX(y) + trunkW(y) / 2, y);
      ctx.lineTo(tx0 + tw * 1.3, yBase + 6);
      ctx.closePath(); ctx.fillStyle = css(hex("#1a1520"), 1); ctx.fill();
      // bark in vertical dabs: cool on the shadow side, warm rim toward the afterglow
      const n = (yBase - yTop) * tw / (18 * S * S);
      for (let i = 0; i < n; i++){
        const y = R(yTop - 10, yBase + 4), hw = trunkW(y) / 2;
        const u = RG() * .95;                                  // -1 (left edge) .. 1 (right edge)
        const x = trunkX(y) + u * hw;
        let c;
        if (u > .68) c = mix(hex("#33262a"), hex("#7a5442"), (u - .68) / .32);   // last light on the bark
        else if (u < -.45) c = mix(hex("#1a1822"), hex("#262a42"), (-u - .45) / .55);
        else c = mix(hex("#1e171d"), hex("#33262a"), rnd());
        c = jit(c, .02, .05, .03);
        dab(x, y, R(2.5, 6) * S, R(20, 46) * S, RG() * .06, c, R(.5, .85));
      }
    }
    // limbs reaching up into the crown and out over the water
    function limb(x, y, ang, len, wid, depth){
      const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
      const cx = (x + ex) / 2 + RG() * len * .18, cy = (y + ey) / 2 + RG() * len * .18;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(cx, cy, ex, ey);
      ctx.strokeStyle = css(hex("#1e1823"), 1); ctx.lineWidth = wid; ctx.lineCap = "round"; ctx.stroke();
      if (depth > 0){
        const k = 2 + (rnd() < .5 ? 1 : 0);
        for (let i = 0; i < k; i++)
          limb(ex, ey, ang + RG() * .9 - .15, len * R(.55, .8), wid * .6, depth - 1);
      }
    }
    {
      const top = yTop + 8, cx = trunkX(top);
      const dirs = portrait ? [-2.5, -2.0, -1.55, -1.1, -.7, -.35] : [-2.6, -2.15, -1.75, -1.35, -1.0, -.65, -.3];
      // limbs stay inside the crown; nothing bare pokes out past the leaves
      ctx.save(); ctx.beginPath(); ctx.ellipse(canopy.x, canopy.y, canopy.rx * .95, canopy.ry * .95, 0, 0, TAU); ctx.clip();
      dirs.forEach(a => limb(cx + RG() * tw * .2, top + R(0, 30) * S, a + RG() * .12, H * R(.16, .26), tw * R(.28, .42), 3));
      ctx.restore();
    }
    // the crown: laurel leaves, dark and dense at blue hour. Only the rim that
    // faces the sky picks up its light, and only the edge toward the afterglow
    // is warmed, judged against the crown as a whole rather than each lobe.
    function crownLight(x, y, r, outer){
      const nx = (x - canopy.x) / canopy.rx, ny = (y - canopy.y) / canopy.ry;
      const d = Math.hypot(nx, ny);
      const up = clamp(-ny * .7 + .35, 0, 1);
      // light reaches the outer clumps of the crown; inside stays dark
      const rim = Math.max(smooth((d - .55) / .5), outer * Math.pow(r, 2.2) * .9);
      return { sky: rim * up, warm: rim * clamp(nx * .8 + .1, 0, 1) * (1 - up * .4), d };
    }
    function cluster(cx, cy, rx, ry, density, light){
      const n = (rx * ry * TAU / (S * S)) * density;
      const outer = smooth((Math.hypot((cx - canopy.x) / canopy.rx, (cy - canopy.y) / canopy.ry) - .45) / .45);
      const tone = RG() * .05;                                 // each clump a little lighter or darker
      for (let i = 0; i < n; i++){
        const a = rnd() * TAU, r = Math.sqrt(rnd());
        const x = cx + Math.cos(a) * r * rx, y = cy + Math.sin(a) * r * ry;
        const l = light(x, y, r, outer);
        let c = mix(hex("#0a1511"), hex("#183a2c"), clamp(rnd() * .8 + tone, 0, 1));
        c = mix(c, hex("#48657f"), l.sky * .55 * R(.4, 1));
        c = mix(c, hex("#8f7a55"), l.warm * .6 * R(.3, 1));
        if (rnd() < .03) c = mix(c, hex("#4d6fb5"), .45);   // a stray leaf catching pure sky
        c = jit(c, .03, .08, .04);
        const L = R(7, 13) * S, Wd = L * R(.3, .45);
        const rot = rnd() < .6 ? RG() * .8 : rnd() * Math.PI;   // most leaves hang
        dab(x, y, Wd, L, rot, c, R(.8, 1));
      }
    }
    {
      const { x: cx, y: cy, rx, ry } = canopy;
      // a rounded mass built from overlapping lobes, thinning to a lacy rim.
      // The inner lobes get a dark underpainting first so no sky shows through
      // the body of the crown.
      // lobes sit on jittered rings so the whole body of the crown is covered
      const inner = [];
      [[0, 1], [.36, 7], [.7, 13]].forEach(([ring, count]) => {
        for (let i = 0; i < count; i++){
          const a = (i / count) * TAU + RG() * .25, r = ring + RG() * .06;
          inner.push([cx + Math.cos(a) * r * rx, cy + Math.sin(a) * r * ry, rx * R(.3, .4), ry * R(.36, .5), R(.05, .09)]);
        }
      });
      dab(cx, cy, rx * 1.5, ry * 1.5, 0, hex("#0b1712"), 1);
      inner.forEach(([lx, ly, lrx, lry]) => dab(lx, ly, lrx * 1.8, lry * 1.8, 0, hex("#0b1712"), 1));
      inner.forEach(([lx, ly, lrx, lry, d]) => cluster(lx, ly, lrx, lry, d, crownLight));
      for (let i = 0; i < 26; i++){   // outer lobes, thinner, for a lacy rim
        const a = (i / 26) * TAU + RG() * .2;
        cluster(cx + Math.cos(a) * rx * R(.78, 1.0), cy + Math.sin(a) * ry * R(.78, 1.0), rx * R(.14, .24), ry * R(.18, .3), R(.03, .06), crownLight);
      }
      // a few strands hanging from the underside
      for (let i = 0; i < (portrait ? 3 : 5); i++){
        const sx = cx + RG() * rx * .5, sy = cy + ry * R(.7, 1.0);
        for (let k = 0; k < R(2, 5); k++)
          cluster(sx + RG() * 6 * S, sy + k * 10 * S, 7 * S, 7 * S, .1, crownLight);
      }
    }

    // ---- the child, sitting against the trunk, lit by the game ----
    {
      const h = H * .115;                                     // seat to crown of head
      const kx = trunkX(yBase - h * .3) + trunkW(yBase - h * .3) / 2 + h * .05;
      const ky = yBase - 2 * S;                               // where they sit
      const skin = hex("#141327");
      const part = (x, y, w, hh, rot, c = skin, a = .96) => dab(kx + x * h, ky + y * h, w * h, hh * h, rot, c, a);
      // pool of light on the grass first, so the figure sits over it
      const dx = kx + h * .48, dy = ky - h * .5;               // the handheld
      const glow = hex("#cfe9b8");
      ctx.globalCompositeOperation = "lighter";
      {
        const g = ctx.createRadialGradient(dx, dy + h * .1, 0, dx, dy + h * .1, h * 1.25);
        g.addColorStop(0, css(glow, .28)); g.addColorStop(.35, css(glow, .10)); g.addColorStop(1, css(glow, 0));
        ctx.fillStyle = g; ctx.fillRect(dx - h * 1.3, dy - h * 1.2, h * 2.6, h * 2.5);
        for (let i = 0; i < 60; i++){                         // lit grass blades around them
          const a = rnd() * Math.PI, r = R(.2, 1.0) * h;
          const x = dx + Math.cos(a) * r * 1.3, y = ky + R(-.02, .12) * h;
          stroke(x, y, R(4, 10) * S, -TAU / 4 + RG() * .5, R(1, 1.8) * S, glow, R(.08, .3) * (1 - r / h));
        }
      }
      ctx.globalCompositeOperation = "source-over";
      // legs: knees drawn up
      part(.32, -.22, .40, .17, -.55);        // thigh
      part(.50, -.10, .16, .36, .15);         // shin
      part(.54, .02, .16, .09, 0);            // foot
      part(.24, -.18, .34, .15, -.5, hex("#191830"));   // far thigh
      // body leaning back on the bark, arms forward to the handheld
      part(.14, -.48, .34, .58, .12);         // torso
      part(.30, -.55, .30, .11, -.35);        // upper arm
      part(.42, -.48, .22, .09, .55);         // forearm
      // head, tilted down toward the screen
      part(.22, -.86, .30, .32, .1);
      part(.20, -.94, .32, .22, .05, hex("#100f22"));   // hair
      // the handheld and its light on the face, hands and knees
      ctx.fillStyle = css(hex("#eef8df"), .95);
      ctx.beginPath(); ctx.ellipse(dx, dy, h * .075, h * .05, .1, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "lighter";
      const lit = (x, y, w, hh, rot, a) => dab(kx + x * h, ky + y * h, w * h, hh * h, rot, glow, a);
      lit(.31, -.78, .10, .15, .3, .32);       // face
      lit(.27, -.71, .09, .05, .2, .25);       // chin / neck
      lit(.44, -.52, .10, .07, .5, .45);       // hands
      lit(.36, -.40, .16, .07, -.4, .30);      // chest
      lit(.50, -.30, .12, .08, -.6, .30);      // knee
      lit(.46, -.20, .10, .06, .1, .2);        // shin
      {
        const g = ctx.createRadialGradient(dx, dy, 0, dx, dy, h * .6);
        g.addColorStop(0, css(glow, .35)); g.addColorStop(1, css(glow, 0));
        ctx.fillStyle = g; ctx.fillRect(dx - h * .6, dy - h * .6, h * 1.2, h * 1.2);
      }
      ctx.globalCompositeOperation = "source-over";
    }

    canvas.classList.add("ready");
  }

  paint();
  let last = [window.innerWidth, window.innerHeight], timer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const w = window.innerWidth, h = window.innerHeight;
      // repaint for a real resize, not for a phone's address bar sliding
      if (w !== last[0] || Math.abs(h - last[1]) > 140){ last = [w, h]; paint(); }
    }, 180);
  });
})();
</script>
</body>
</html>
